.f-hth{fill:var(--heat,#94500e);font-family:var(--font-display,system-ui,sans-serif);font-size:13px;font-weight:700;letter-spacing:.05em}
</style><defs><marker id="FIGID-ak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-inkf"/></marker><marker id="FIGID-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-acf"/></marker><marker id="FIGID-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-htf"/></marker></defs><rect class="f-bg" x="0" y="0" width="360" height="224" rx="10"/><circle cx="105" cy="112" r="76" class="f-mt"/><circle cx="105" cy="112" r="60" class="f-hole"/><polygon points="112,58 112,30 98,30 98,58" class="f-wd2"/><polygon points="159,119 187,119 187,105 159,105" class="f-wd2"/><polygon points="98,166 98,194 112,194 112,166" class="f-wd2"/><polygon points="51,105 23,105 23,119 51,119" class="f-wd2"/><text x="105" y="20" class="f-sm" text-anchor="middle">12 · cierre</text><text x="105" y="214" class="f-sm" text-anchor="middle">6 · inicio</text><text x="194" y="116" class="f-tx" text-anchor="middle">3</text><text x="16" y="116" class="f-tx" text-anchor="middle">9</text><text x="210" y="56" class="f-ach" text-anchor="start">AUTOEVALUACIÓN</text><text x="210" y="78" class="f-tx" text-anchor="start">Cortá en los empalmes</text><text x="210" y="94" class="f-tx" text-anchor="start">(6 y 12) y en los</text><text x="210" y="110" class="f-tx" text-anchor="start">verticales (3 y 9).</text><text x="210" y="138" class="f-sm" text-anchor="start">En el examen las ubica</text><text x="210" y="153" class="f-sm" text-anchor="start">el inspector según</text><text x="210" y="168" class="f-sm" text-anchor="start">el código.</text><text x="210" y="192" class="f-sm" text-anchor="start">Marcá la hora con tiza</text><text x="210" y="207" class="f-sm" text-anchor="start">antes de cortar.</text></svg>
