.f-inkf{fill:var(--ink,#18212a)}
.f-acf{fill:var(--accent,#1d5a86)}
.f-htf{fill:var(--heat,#94500e)}
.f-tx{fill:var(--ink,#18212a);font-family:var(--font-body,system-ui,sans-serif);font-size:12px;font-weight:600}
