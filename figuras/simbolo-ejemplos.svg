<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 355" role="img" aria-labelledby="FIGID-t"><title id="FIGID-t">Ejemplos de símbolos de soldadura</title><style>
.f-bg{fill:var(--fig-bg,#ffffff)}
