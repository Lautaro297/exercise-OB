><text x="248" y="122" class="f-tx" text-anchor="start">Raíz</text><text x="248" y="137" class="f-sm" text-anchor="start">la raíz</text><text x="248" y="151" class="f-sm" text-anchor="start">queda afuera</text><path d="M210 172 L210 194 A12 12 0 0 0 234 194 L234 172" class="f-spm" /><path d="M206.5 194 A15.5 15.5 0 0 0 237.5 194" class="f-ht" /><text x="248" y="184" class="f-tx" text-anchor="start">Lateral</text><text x="248" y="199" class="f-sm" text-anchor="start">rebanada de 10 mm,</text><text x="248" y="213" class="f-sm" text-anchor="start">se dobla de costado</text><text x="180" y="258" class="f-sm" text-anchor="middle">La probeta puede saltar: poné una pantalla</text><text x="180" y="273" class="f-sm" text-anchor="middle">delante y no te pares en su línea.</text></svg>
